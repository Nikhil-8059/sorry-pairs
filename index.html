<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry Pairs 🧸</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap');
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdeff2;--ink:#4a2c3d;--card:#ffffff;--back:#f7a8c0;--back2:#e98aab;--soft:#ffd9e4;--gold:#ffd873;--ok:#bfe8c9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a28;--ink:#ffe6ee;--card:#3d2638;--back:#c9668a;--back2:#a94f72;--soft:#4a2e44;--gold:#e8b94f;--ok:#2f5a40}}
:root[data-theme="dark"]{--bg:#2a1a28;--ink:#ffe6ee;--card:#3d2638;--back:#c9668a;--back2:#a94f72;--soft:#4a2e44;--gold:#e8b94f;--ok:#2f5a40}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:460px;margin:0 auto;padding:18px 16px 40px;text-align:center}
h1{font-size:1.6rem;font-weight:600;margin:6px 0 2px}
p{margin:0}
.sub{opacity:.8;font-size:1rem}
#bear{font-size:64px;line-height:1;margin:10px 0 2px;display:inline-block;transition:transform .3s}
#bear.pop{transform:scale(1.25) rotate(-6deg)}
#say{min-height:26px;font-size:1.05rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.c{aspect-ratio:3/4;perspective:600px;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.c:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:14px}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.c.up .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:2.1rem}
.b{background:linear-gradient(145deg,var(--back),var(--back2));color:#fff;font-size:1.5rem;box-shadow:0 3px 0 var(--back2)}
.fr{background:var(--card);transform:rotateY(180deg);box-shadow:0 3px 0 var(--soft)}
.c.done .fr{background:var(--ok)}
.c.done .in{animation:hop .5s}
@keyframes hop{50%{transform:rotateY(180deg) translateY(-8px)}}
#notes{margin:18px 0 0;display:flex;flex-direction:column;gap:8px}
.n{background:var(--card);border-radius:14px;padding:9px 14px;text-align:left;font-size:1rem;box-shadow:0 2px 0 var(--soft);animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
#end{display:none;margin-top:22px;padding:20px 16px;background:var(--card);border-radius:20px;box-shadow:0 4px 0 var(--soft)}
#end h2{margin:0 0 8px;font-size:1.35rem}
#end p{line-height:1.5;margin-bottom:14px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.big{font:inherit;font-weight:500;border:0;border-radius:999px;padding:11px 20px;background:var(--back2);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
button.big.alt{background:var(--gold);color:#4a2c3d}
button.big:active{transform:translateY(2px);box-shadow:none}
.moves{font-size:.9rem;opacity:.7;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div id="bear" aria-hidden="true">🥺</div>
  <h1>Sorry Pairs</h1>
  <p class="sub">Match the pairs. Each one is something I want to say.</p>
  <p id="say" aria-live="polite"></p>
  <p class="moves" id="mv">Tries: 0</p>
  <div class="grid" id="grid"></div>
  <div id="notes"></div>
  <div id="end">
    <h2 id="eh">I'm really sorry 💛</h2>
    <p id="et"></p>
    <div class="btns" id="eb">
      <button class="big" id="y1">Forgive me? 🥹</button>
      <button class="big alt" id="y2">Hug first? 🤗</button>
    </div>
  </div>
</main>
<script>
const NAME = ""; // her name goes here, e.g. "Priya"
const who = NAME || "love";
const pairs = [
  ["🧸","I'm sorry I hurt you."],
  ["🍫","You matter more to me than being right."],
  ["🌙","I should have listened properly."],
  ["🌼","I'll choose kinder words next time."],
  ["☕","I'm here, and I'm not going anywhere."],
  ["💌","I love you, " + who + "."]
];
const moods = ["🥺","😢","🙂","😊","🥰","🥰"];
const cheers = ["One down!","He's feeling a little better.","Yes, that one!","Almost there…","So close!","All of them!"];
let deck = [], open = [], lock = false, matched = 0, tries = 0;
const grid = document.getElementById('grid'), notes = document.getElementById('notes');
const bear = document.getElementById('bear'), say = document.getElementById('say');

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
  open = []; lock = false; matched = 0; tries = 0;
  document.querySelectorAll('.rp').forEach(x=>x.remove());
  grid.innerHTML = ''; notes.innerHTML = '';
  document.getElementById('mv').textContent = 'Tries: 0';
  document.getElementById('end').style.display = 'none';
  document.getElementById('eb').style.display = 'flex';
  document.getElementById('eh').textContent = "I'm really sorry 💛";
  bear.textContent = moods[0];
  deck = shuffle(pairs.flatMap((p,i)=>[{i,e:p[0]},{i,e:p[0]}]));
  deck.forEach((d,k)=>{
    const b = document.createElement('button');
    b.className='c'; b.setAttribute('aria-label','Card '+(k+1));
    b.innerHTML = '<div class="in"><div class="f b">🐾</div><div class="f fr">'+d.e+'</div></div>';
    b.onclick = ()=>flip(b,d);
    grid.appendChild(b);
  });
  say.textContent = "Tap a card to start.";
  window.scrollTo({top:0,behavior:'smooth'});
}
start();

function flip(b,d){
  if(lock || b.classList.contains('up')) return;
  b.classList.add('up'); open.push([b,d]);
  if(open.length<2) return;
  tries++; document.getElementById('mv').textContent='Tries: '+tries;
  const [[b1,d1],[b2,d2]] = open; open = [];
  if(d1.i===d2.i){
    matched++;
    setTimeout(()=>{b1.classList.add('done');b2.classList.add('done')},350);
    const n = document.createElement('div'); n.className='n'; n.textContent = d1.e+'  '+pairs[d1.i][1];
    notes.appendChild(n);
    bear.textContent = moods[matched-1]; bear.classList.add('pop');
    setTimeout(()=>bear.classList.remove('pop'),300);
    say.textContent = cheers[matched-1];
    if(matched===pairs.length) setTimeout(finish,900);
  } else {
    lock = true; say.textContent = "Not that pair, try again.";
    setTimeout(()=>{b1.classList.remove('up');b2.classList.remove('up');lock=false},800);
  }
}

function finish(){
  const e = document.getElementById('end'); e.style.display='block';
  document.getElementById('et').textContent =
    "You found every pair, and I meant every word. I said something I shouldn't have, and I'm sorry. I'd like to make it right, in whatever way you need.";
  e.scrollIntoView({behavior:'smooth',block:'center'});
  const reply = t => {document.getElementById('eh').textContent=t;document.getElementById('eb').style.display='none';
    document.getElementById('et').textContent = "Thank you for being the kindest person I know. 💛"; bear.textContent="🧸💞";
    const r = document.createElement('button'); r.className='big alt'; r.textContent='Play again 🔁'; r.onclick=start;
    const w = document.createElement('div'); w.className='btns rp'; w.appendChild(r); document.getElementById('end').appendChild(w);};
  document.getElementById('y1').onclick = ()=>reply("Thank you, " + who + " 🥹");
  document.getElementById('y2').onclick = ()=>reply("Hug incoming 🤗");
}
</script>
</body>
</html>
